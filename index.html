<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صفحه تست محلی</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }
        .test-banner {
            background-color: #d9534f;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 40px);
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h3 { color: #f6851b; margin-top: 0; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #f6851b;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #e2761b; }
    </style>
</head>
<body>

    <div class="test-banner">⚠️ این صفحه تست است و صرفاً برای بررسی محلی کاربرد دارد</div>

    <div class="container">
        <div class="card">
            <h3>شبیه‌ساز فرم</h3>
            <form onsubmit="alert('تست موفق: داده‌ها در محیط محلی متوقف شدند.'); return false;">
                <input type="text" placeholder="متن یا داده تستی..." required>
                <button type="submit">تست دکمه</button>
            </form>
        </div>
    </div>

</body>
</html>
